# Worker Cloudflare — les deux points d'entrée Stripe.
#
# Le palier gratuit (100 000 requêtes/jour) autorise l'usage commercial,
# contrairement au plan Hobby de Vercel. Voir docs/STRIPE.md.
name = "kairos-stripe"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# `nodejs_compat` est nécessaire au SDK Stripe, qui importe encore quelques
# primitives Node même en mode fetch.
compatibility_flags = ["nodejs_compat"]

[vars]
FIREBASE_PROJECT_ID = "kairos-on"
# Firebase Hosting reste déployable (scripts/deploy.sh, intact) et Vercel
# s'y ajoute : les deux origines coexistent, retirer l'une ne dépend que du
# choix final d'hébergement, jamais du code du Worker.
ALLOWED_ORIGINS = "https://kairos-on.web.app,https://kairos-on.firebaseapp.com,https://kairos-on.vercel.app"

# Identifiants de prix Stripe. Ce ne sont **pas** des secrets : ils
# apparaissent de toute façon dans l'URL de paiement. Les mettre ici plutôt
# que dans le tableau de bord Cloudflare est délibéré — `wrangler deploy`
# remplace les variables du tableau de bord par celles de ce fichier, donc
# une valeur saisie là-bas serait effacée au déploiement suivant. Les
# *secrets*, eux, survivent : c'est pour ça qu'ils ne sont pas ici.
#
# Décommente au fur et à mesure. Une offre sans prix est simplement
# invendable — le bouton correspondant ne s'affiche pas, et `/health` liste
# ce qui manque. Lancer avec Creator seul est un cas prévu.
#
# ⚠️ Ces valeurs vivent **ici et nulle part ailleurs**. Posées en secrets
# dans le tableau de bord, elles ne sont pas remontées jusqu'au Worker
# (constaté le 2026-08-10 : `/health` listait Creator comme manquant alors
# que les deux secrets existaient). Le fichier, lui, est déployé tel quel à
# chaque commit — c'est vérifiable en relisant le dépôt. Si un secret du
# même nom est recréé plus tard, il entrera en conflit avec la variable
# ci-dessous : n'en garder qu'un seul emplacement, celui-ci.
STRIPE_PRICE_CREATOR_MONTHLY = "price_1U2Zjw4Do0A9o9JDl0l0oZkU"
STRIPE_PRICE_CREATOR_YEARLY  = "price_1U2ZmQ4Do0A9o9JDMmG04oUW"
STRIPE_PRICE_PRO_MONTHLY     = "price_1U3ZEm4Do0A9o9JDgQwLlDrv"
STRIPE_PRICE_PRO_YEARLY      = "price_1U3ZGE4Do0A9o9JDoGaLDMUD"

# Secrets, à poser avec `wrangler secret put <NOM>` — jamais dans ce fichier :
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   FIREBASE_SERVICE_ACCOUNT

# Journaux — pour diagnostiquer « Erreur interne » sur /stripe/checkout sans
# deviner. Le Worker journalise déjà l'exception réelle côté serveur
# (`console.error("[worker] erreur non rattrapée", …)`), jamais au client :
# ça évite d'exposer un détail interne, mais ça veut dire que sans
# observabilité activée, cette ligne n'était vue par personne.
#
# Posé ici plutôt que dans le tableau de bord pour la même raison que les
# prix ci-dessus : ce fichier est déployé tel quel à chaque commit, un
# réglage fait au clic ne survivrait pas forcément au déploiement suivant.
#
# `enabled = true` à la racine est nécessaire — documenté par Cloudflare
# comme le commutateur général, indépendant du sous-bloc `logs` : un
# tableau de bord qui affiche `"enabled": false` en tête, même avec
# `logs.enabled: true` en dessous, correspond à une observabilité qui ne
# tourne pas encore.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

# Pas de bloc [observability.traces] : la version de wrangler verrouillée
# ci-dessous (^3.99.0 — la même que Cloudflare installe au déploiement,
# vérifié en `--dry-run`) ne reconnaît pas encore ce champ et le signale en
# avertissement à chaque build. Les traces servent au débogage de
# performance, pas au diagnostic d'une erreur métier ; rien à activer tant
# que le besoin ne se présente pas. À ajouter le jour où `wrangler@4` est
# installé.
